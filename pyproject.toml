[project]
name = "mailcraft"
version = "0.1.0"
description = "Official Python SDK for the MailCraft email API — transactional email, SMTP relay, marketing campaigns, automations, and contact management."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mail-craft/mailcraft-python"
Documentation = "https://docs.mailcraft.host"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
